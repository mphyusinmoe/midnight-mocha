<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" type="text/css" href="onlineorder.css">
	<!----fontawesome link----->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
	<!----------desktop view--------------->
	<div id="container" class="container">
		<div id="menu">
			<div class="brand-logo">
				<img src="image/logo.png" alt="americano" >
			</div>
			<div class="menu-item">
				<a href="home.html">Home</a>
				<a href="about.html">About</a>
				<a href="menu.html">Menu</a>
				<a href="our_food.html">Our Food</a>
				<a href="contact.html">Contact</a>
			</div>
		</div>
		<div id="food-container">
			<div id="header">
				<div class="add-box">
					<i class="fa fa-map-marker  your-address" id="add-address">Your Address</i>
				</div>
				<div class="util">
					<!--<i class="fa fa-search">Search</i>
					<i class="fa fa-tags">Offers</i>--->
					<i class="fa fa-cart-plus" id="m-cart-plus">0 items</i>
				</div>
			</div>

			<div id="food-items" >
				<div id="Coffee">
					<p id="category-name">Coffee</p>
					<!---------coffee1---->
					

				</div>

				<div id="Drinks">
					<p id="category-name">Drinks</p>
					<!---------------drink1--------->
					
				</div>

				<div id="cakes">
					<p id="category-name">Cakes</p>
					<!-------cake1----------->
					
				</div>

				<div id="pasta">
					<p id="category-name">Pasta</p>
					<!----------pasta1------->
					
				</div>

				<div id="pizza">
					<p id="category-name">Pizza</p>
					<!------------pizza1--------->
					
				</div>


			</div>
			<div id="cart-page" class="cart-toggle">
				<p id="cart-title"> Card Items</p>
				<p id="m-total-amount">Total Amount:1000kyats</p>
				<table>
					<thead>
						<td>Item</td>
						<td>Name</td>
						<td>Quantity</td>
						<td>Price</td>
					</thead>
					<tbody id="table-body">
						
					</tbody>
				</table>
			</div>
		</div>
		<div id="cart">
			<div class="taste-header">
				<div class="user">
				<!--	<i class="fa fa-user-circle">Account</i>-->
				</div>
			</div>
			<div id="category-list">
				<p class="item-menu">Category</p>
				<div class="border"></div>	
				  
			</div>
			<div id="checkout" class="cart-toggle">
				<p id="total-item">Total Item : 5</p>
				<p id="total-price"></p>
				<p id="delivery">Free Delivery above 30000 kyats</p>
				<button class="cart-btn"><a href="./thanks.html">Checkout</a></button>
			</div>
		</div>
	</div>
	<!----------javascript--------------->
	<script src="/onlineorder.js" type="module"></script>
</body>
</html>
